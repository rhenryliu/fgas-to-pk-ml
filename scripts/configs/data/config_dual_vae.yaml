# Pinned DataConfig for the dual-VAE programme (staged spec v2).
#
# This is the single evaluation context for every dual-VAE stage (Stages 1-5)
# and for the refreshed baselines: identical data selection, target window, and
# conditioning for every model, so all comparisons share folds and features.
# It follows the config_camels.yaml pattern verbatim. Do not edit per stage --
# the whole point is that this file is written once and reused everywhere.
#
# Dry-run:
#
#     python -m fgas_spk.loader --config scripts/configs/data/config_dual_vae.yaml

# --- Dataset selection (store fields; resolved via resolve_dataset_path) ---
project_root: /pscratch/sd/r/rhliu/projects/fgas-to-pk-ml/ # NERSC Perlmutter
suite: CAMELS-IllustrisTNG-L50n512-SB35
snapshot: 74          # z = 0.47 (single-snapshot training only; decision F0.7)
redshift: 0.47
source: lindajin
rank: m500            # on-disk rank token (m500 / mstar / frozen)
tag: '20260706'       # pinned tag (Branch A rebuild, corrected fgas statistic;
                      # supersedes 20260702/20260617 by DEFINITION change)

# --- Simulation subset (null = all, in stored order) ---
sim_ids: null

# --- Inputs / features ---
number_density_indices: [2]    # single number density; one row per simulation
radial_range_mpch: null        # full radial range
include_nd_feature: false      # nd is constant across rows here; no X_cond
include_mean_halo_mass: false
include_camels_params: true    # 5 cosmological params -> X_params (decision F0.4)
camels_param_indices: null
# Conditioning set per decision F0.4: cosmological parameters only, no
# astrophysical parameters. Consumed as encoder+decoder context by the VAEs.
camels_param_names: [Omega0, sigma8, OmegaBaryon, HubbleParam, n_s]

# --- Target ---
target_mode: k_range   # SP(k) over the proxy-sound window
k_target: null
k_range: [0.5, 5.0]    # h/Mpc (inclusive); see the suppression-target caveat

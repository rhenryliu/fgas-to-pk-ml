# RunConfig for the cvae **noise-head variant**: the Sohn-style conditional VAE
# (fgas_spk.models.cvae) with the learned per-k observation-noise head enabled
# (obs_noise_head: true). An exact copy of scripts/configs/run/cvae.yaml plus
# that one flag: the reconstruction term becomes a Gaussian NLL with a learnable
# per-k obs_logvar, and predict_samples() adds the learned observation noise to
# each decoded draw, supplying the aleatoric spread the plain cvae lacks (its
# documented under-coverage). Every hyperparameter below is frozen at the
# committed cvae.yaml values; note beta has different semantics under the NLL
# than under the squared-error loss (see the module docstring).
#
#     python scripts/run.py --config-data scripts/configs/data/config_dual_vae.yaml \
#                           --config-run  scripts/configs/run/cvae_noise.yaml
#
# This is a genuine conditional generative model of p(SP(k) | f_gas(R), context):
# a recognition network q(z|x,y), a conditional prior p(z|x), and a decoder
# p(y|z,x). Unlike vib_regressor (a regularised point predictor), its
# predict_samples() draws z ~ p(z|x) and decodes them, so the across-sample spread
# is an estimate of how tightly a given f_gas(R) profile constrains SP(k). predict()
# returns the deterministic prior-mean point prediction (an approximation to
# E[y|x]). That spread is only cleanly interpretable on the proxy-sound k_range
# target (k in [0.5, 5.0] h/Mpc) -- set that in the DataConfig, not here. Because it
# exposes predict_samples, the runner writes the probabilistic coverage /
# spread-vs-error figures for this model (it does not for vib_regressor).
#
# model_params below are the model's own defaults, listed explicitly so the
# recorded config_run.yaml reflects exactly what trained.

model: cvae                   # registry name (fgas_spk.models.REGISTRY)
model_params:
  latent_dim: 1               # width of the stochastic latent
  hidden: 128                 # modest width: favour regularisation over capacity
  n_layers: 2                 # hidden layers in each of the three networks
  epochs: 200
  lr: 5.0e-4
  weight_decay: 1.0e-4        # >0 -> AdamW (decoupled); 0 -> plain Adam
  dropout: 0.0                # dropout after each hidden activation (regulariser)
  batch_size: 128
  beta: 1.0                  # terminal KL weight in the ELBO after annealing
  anneal_epochs: null         # null -> epochs // 4 (= 50); linear KL warm-up
  val_frac: 0.1               # internal holdout for best-epoch restore (0 disables)
  obs_noise_head: true        # learned per-k observation-noise head (NLL recon)

seed: 0                    # reproducibility seed (threaded into torch.manual_seed)

# Grouped-by-sim_index split of the DATA into train/val/test folds. Distinct from
# model_params.val_frac above (an internal holdout *within* the training fold for
# best-epoch selection). Matches scripts/configs/run/vib_regressor.yaml so a
# cvae-vs-vib comparison runs on the same folds. val_frac: 0.0 -> two-way split.
split:
  train_frac: 0.7
  val_frac: 0.1
  test_frac: 0.2
  seed: 10

# Held-out evaluation diagnostics (post-fit only; do not affect training).
evaluation:
  suppressed_thresholds: [0.95, 0.9, 0.8]   # pooled held-out RMSE where TRUE SP(k) < t

# Scratch write root. null defers to $FGAS_SCRATCH_ROOT (or --scratch-root).
write_root: null

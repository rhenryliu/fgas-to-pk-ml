# RunConfig for the dual_vae composite, (pca, pca) ablation arm.
# Declared test configuration 3 of 3 (see
# experiments/notes/dual_vae_test_declaration.md). Hyperparameters are the
# staged selections on the pinned context (tag 20260706, R < 10 crop):
# Both codecs PCA (amendment B7 ablation arm): PCA-x d=4, PCA-y d=3
# (matching the selected VAE-Y dimensionality); obs_sigma role is the
# train-fold truncation-residual std; MDN mapping (rung 3, K=3).
#
#     python scripts/run.py --config-data scripts/configs/data/config_dual_vae.yaml \
#                           --config-run  scripts/configs/run/dual_vae_pca_pca.yaml

model: dual_vae               # registry name (fgas_spk.models.REGISTRY)
model_params:
  codec_x: pca
  codec_y: pca
  latent_dim_x: 4          # PCA codec dimension (best Stage 4.0 reference arm)
  latent_dim_y: 3
  beta_x: 0.01
  beta_y: 1.0e-4
  hidden: 128
  n_layers: 2
  epochs: 5000                # VAE codec schedule (best-epoch restore inside)
  lr: 1.0e-3
  weight_decay: 1.0e-4
  dropout: 0.0
  batch_size: 128
  anneal_epochs: null         # -> epochs // 4, linear KL warm-up
  val_frac: 0.1               # internal holdout for best-epoch restore
  mapping: mdn                # rung 3 (probabilistic; predict_samples enabled)
  mdn_components: 3
  map_epochs: 2000

seed: 0

# Pinned grouped-by-sim_index split (identical across every dual-VAE stage).
split:
  train_frac: 0.7
  val_frac: 0.1
  test_frac: 0.2
  seed: 100

evaluation:
  suppressed_thresholds: [0.95, 0.9, 0.8]

write_root: null

# RunConfig for the PCA API-reference model (fgas_spk.models.pca_linear).
# Pair this with a DataConfig (e.g. scripts/configs/data/config.yaml) and run:
#
#     python scripts/run.py --config-data scripts/configs/data/config.yaml \
#                           --config-run  scripts/configs/run/pca_reference.yaml
#
# or the worked example: python scripts/run_pca_demo.py

model: pca_linear          # registry name (fgas_spk.models.REGISTRY)
model_params:
  n_components: 8          # PCA components of the f_gas profile (capped at fit time)
seed: 0                    # reproducibility seed (threaded into PCA random_state)

# Grouped-by-sim_index split. val_frac: 0.0 means a two-way train/test split.
split:
  train_frac: 0.8
  val_frac: 0.0
  test_frac: 0.2
  seed: 0

# Scratch write root. null defers to $FGAS_SCRATCH_ROOT (or --scratch-root).
write_root: null
